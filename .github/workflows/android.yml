
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.lasanadoctrina \
              --project-name app \
              /tmp/la_sana_doctrina_android

            cp -R /tmp/la_sana_doctrina_android/android ./android
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')

          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")

          s = p.read_text()

          marker = 'com.google.android.gms.ads.APPLICATION_ID'

          if marker not in s:
              meta = '''        <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-3642704038738168~6121712215"/>
          '''
              s = s.replace(
                  '</application>',
                  meta + '    </application>'
              )

          p.write_text(s)
          PY

      - name: Configure app identity and Android 16 target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text, count = re.subn(
              r'android:label="[^"]+"',
              'android:label="La Sana Doctrina"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not set the Android app display name")
          manifest.write_text(text)

          gradle_files = [
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle'),
          ]
          updated = False
          for gradle in gradle_files:
              if not gradle.exists():
                  continue
              text = gradle.read_text()
              if gradle.suffix == '.kts':
                  text = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.lasanadoctrina.app"', text, count=1)
                  text = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.lasanadoctrina.app"', text, count=1)
                  text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              else:
                  text = re.sub(r'namespace\s+"[^"]+"', 'namespace "com.lasanadoctrina.app"', text, count=1)
                  text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.lasanadoctrina.app"', text, count=1)
                  text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  text = text.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 36')
              if not re.search(r'targetSdk\s*=\s*36|targetSdkVersion\s+36', text):
                  raise SystemExit(f"Android target API 36 was not configured in {gradle}")
              gradle.write_text(text)
              updated = True
              break

          if not updated:
              raise SystemExit("Android Gradle file not found")
          PY

      - name: Verify production AdMob configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dart = Path('lib/main.dart').read_text()
          workflow = Path('.github/workflows/android.yml').read_text()
          production_unit = 'ca-app-pub-3642704038738168/1480914570'
          production_app = 'ca-app-pub-3642704038738168~6121712215'
          debug_test_unit = 'ca-app-pub-3940256099942544/6300978111'

          if production_unit not in dart or 'kReleaseMode' not in dart:
              raise SystemExit('Production banner ID is not restricted to release builds')
          if debug_test_unit not in dart:
              raise SystemExit('Debug builds must use the official Google test banner')
          if production_app not in workflow:
              raise SystemExit('Production AdMob App ID is missing from Android configuration')
          print('Verified: release uses the production banner; debug uses Google test ads.')
          PY

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: la-sana-doctrina-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

