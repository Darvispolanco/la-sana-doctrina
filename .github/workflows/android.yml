
name: Build La Sana Doctrina APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar carpetas
        run: |
          mkdir -p assets/audio assets/images

      - name: Generar estructura Android
        run: |
          flutter create --platforms=android --org com.lasanadoctrina .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Revisar proyecto
        run: flutter analyze

      - name: Generar APK
        run: flutter build apk --debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: la-sana-doctrina-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          
