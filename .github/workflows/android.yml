
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Install Java 21 (required by current Android Lint runtime)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.lasanadoctrina \
              --project-name la_sana_doctrina \
              /tmp/la_sana_doctrina_android

            cp -R /tmp/la_sana_doctrina_android/android ./android
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')

          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")

          s = p.read_text()

          marker = 'com.google.android.gms.ads.APPLICATION_ID'

          if marker not in s:
              meta = '''        <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-3642704038738168~6121712215"/>
          '''
              s = s.replace(
                  '</application>',
                  meta + '    </application>'
              )

          p.write_text(s)
          PY

      - name: Configure app identity and Android 16 target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text, count = re.subn(
              r'android:label="[^"]+"',
              'android:label="La Sana Doctrina"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not set the Android app display name")
          manifest.write_text(text)

          gradle_files = [
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle'),
          ]
          updated = False
          for gradle in gradle_files:
              if not gradle.exists():
                  continue
              text = gradle.read_text()
              if gradle.suffix == '.kts':
                  text = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.lasanadoctrina.la_sana_doctrina"', text, count=1)
                  text = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.lasanadoctrina.la_sana_doctrina"', text, count=1)
                  text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
                  text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              else:
                  text = re.sub(r'namespace\s+"[^"]+"', 'namespace "com.lasanadoctrina.la_sana_doctrina"', text, count=1)
                  text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.lasanadoctrina.la_sana_doctrina"', text, count=1)
                  text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
                  text = text.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 36')
              if not re.search(r'targetSdk\s*=\s*36|targetSdkVersion\s+36', text):
                  raise SystemExit(f"Android target API 36 was not configured in {gradle}")
              gradle.write_text(text)
              updated = True
              break

          if not updated:
              raise SystemExit("Android Gradle file not found")
          PY

      - name: Verify production AdMob configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dart = Path('lib/main.dart').read_text()
          workflow = Path('.github/workflows/android.yml').read_text()
          production_unit = 'ca-app-pub-3642704038738168/1480914570'
          production_app = 'ca-app-pub-3642704038738168~6121712215'
          debug_test_unit = 'ca-app-pub-3940256099942544/6300978111'

          if production_unit not in dart or 'kReleaseMode' not in dart:
              raise SystemExit('Production banner ID is not restricted to release builds')
          if debug_test_unit not in dart:
              raise SystemExit('Debug builds must use the official Google test banner')
          if production_app not in workflow:
              raise SystemExit('Production AdMob App ID is missing from Android configuration')
          print('Verified: release uses the production banner; debug uses Google test ads.')
          PY

      - name: Configure persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::No persistent signing key configured. APKs from this run may require uninstalling the previous app before updating."
            exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Signing keystore secrets are incomplete." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android Gradle file not found')
          source = gradle.read_text()
          if gradle.suffix == '.kts':
              config = '''    signingConfigs {
                  create("persistent") {
                      storeFile = file("release-keystore.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
              if 'create("persistent")' not in source:
                  source = source.replace('    buildTypes {', config + '    buildTypes {', 1)
              source = source.replace('    buildTypes {', '    buildTypes {\n        getByName("debug") { signingConfig = signingConfigs.getByName("persistent") }', 1)
              source = source.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("persistent")')
          else:
              config = '''    signingConfigs {
                  persistent {
                      storeFile file("release-keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
              if 'persistent {' not in source:
                  source = source.replace('    buildTypes {', config + '    buildTypes {', 1)
              source = source.replace('    buildTypes {', '    buildTypes {\n        debug { signingConfig signingConfigs.persistent }', 1)
              source = source.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.persistent')
          if 'persistent' not in source:
              raise SystemExit('Persistent signing configuration was not applied')
          gradle.write_text(source)
          print('Persistent signing configured for debug and release builds.')
          PY
          echo "ANDROID_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK with a unique Android version code
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --debug --build-name=0.1.0 --build-number="${GITHUB_RUN_NUMBER}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Debug build failed; retrying after transient dependency/network failure (attempt $attempt/3)."
              sleep $((attempt * 20))
            fi
          done
          echo "Debug APK build failed after 3 attempts." >&2
          exit 1

      - name: Build production APK with a unique Android version code
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release --build-name=0.1.0 --build-number="${GITHUB_RUN_NUMBER}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Release build failed; retrying after transient dependency/network failure (attempt $attempt/3)."
              sleep $((attempt * 20))
            fi
          done
          echo "Production APK build failed after 3 attempts." >&2
          exit 1

      - name: Preserve production APK with ads
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-with-ads.apk

      - name: Disable native AdMob startup for diagnostic Release
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          source = re.sub(
              r'\s*<meta-data\s+android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID"[^>]*/>',
              '',
              source,
          )
          if 'xmlns:tools=' not in source:
              source = source.replace(
                  '<manifest ',
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1,
              )
          application_close = '</application>'
          removal = '''
                  <provider
                      android:name="com.google.android.gms.ads.MobileAdsInitProvider"
                      tools:node="remove" />
          '''
          if 'com.google.android.gms.ads.MobileAdsInitProvider' not in source:
              source = source.replace(application_close, removal + application_close, 1)
          manifest.write_text(source)
          if 'com.google.android.gms.ads.APPLICATION_ID' in source:
              raise SystemExit('AdMob App ID remains in diagnostic manifest')
          print('Diagnostic manifest excludes AdMob auto-initialization.')
          PY

      - name: Build diagnostic Release APK without ads
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release --dart-define=ENABLE_ADS=false --build-name=0.1.0 --build-number="${GITHUB_RUN_NUMBER}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Diagnostic Release build failed; retrying (attempt $attempt/3)."
              sleep $((attempt * 20))
            fi
          done
          echo "Diagnostic Release APK build failed after 3 attempts." >&2
          exit 1

      - name: Verify Android APK signatures
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release-with-ads.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify APK package metadata
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$AAPT"
          for APK in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-with-ads.apk; do
            test -s "$APK"
            PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
            if [ "$PACKAGE" != "com.lasanadoctrina.la_sana_doctrina" ]; then
              echo "Unexpected package in $APK: $PACKAGE" >&2
              exit 1
            fi
            echo "Verified package $PACKAGE in $APK"
          done

      - name: Give every download a unique filename and checksum
        run: |
          set -euo pipefail
          BUILD_TAG="v0.1.0-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}-run${GITHUB_RUN_ID}"
          OUT="build/app/outputs/flutter-apk"
          mv "${OUT}/app-debug.apk" "${OUT}/LaSanaDoctrina-${BUILD_TAG}-debug.apk"
          (
            cd "${OUT}"
            sha256sum "LaSanaDoctrina-${BUILD_TAG}-debug.apk" > "LaSanaDoctrina-${BUILD_TAG}-debug-SHA256SUM.txt"
          )
          if [ -f "${OUT}/app-release-with-ads.apk" ]; then
            mv "${OUT}/app-release-with-ads.apk" "${OUT}/LaSanaDoctrina-${BUILD_TAG}-release-con-anuncios.apk"
            mv "${OUT}/app-release.apk" "${OUT}/LaSanaDoctrina-${BUILD_TAG}-release-diagnostico-sin-anuncios.apk"
            (
              cd "${OUT}"
              sha256sum "LaSanaDoctrina-${BUILD_TAG}-release-con-anuncios.apk" > "LaSanaDoctrina-${BUILD_TAG}-release-con-anuncios-SHA256SUM.txt"
              sha256sum "LaSanaDoctrina-${BUILD_TAG}-release-diagnostico-sin-anuncios.apk" > "LaSanaDoctrina-${BUILD_TAG}-release-diagnostico-sin-anuncios-SHA256SUM.txt"
            )
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LaSanaDoctrina-v0.1.0-build${{ github.run_number }}-${{ github.run_id }}-debug
          path: |
            build/app/outputs/flutter-apk/LaSanaDoctrina-*-debug.apk
            build/app/outputs/flutter-apk/LaSanaDoctrina-*-debug-SHA256SUM.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload production APK
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LaSanaDoctrina-v0.1.0-build${{ github.run_number }}-${{ github.run_id }}-production
          path: |
            build/app/outputs/flutter-apk/LaSanaDoctrina-*-release-*.apk
            build/app/outputs/flutter-apk/LaSanaDoctrina-*-release-*-SHA256SUM.txt
          if-no-files-found: error
          retention-days: 14

