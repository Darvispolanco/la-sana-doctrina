
name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.lasanadoctrina \
              --project-name la_sana_doctrina \
              /tmp/la_sana_doctrina_android

            cp -R /tmp/la_sana_doctrina_android/android ./android
          fi

      - name: Prepare assets
        run: |
          mkdir -p assets/audio
          mkdir -p assets/images

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')

          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")

          s = p.read_text()

          marker = 'com.google.android.gms.ads.APPLICATION_ID'

          if marker not in s:
              meta = '''        <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-3642704038738168~5569657844"/>
          '''
              s = s.replace(
                  '</application>',
                  meta + '    </application>'
              )

          p.write_text(s)
          PY

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: la-sana-doctrina-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

