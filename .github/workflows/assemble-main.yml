name: Assemble updated main.dart

on:
  push:
    branches:
      - feature/defensa-sana-doctrina-home
    paths:
      - '.github/transfer-parts/**'
      - '.github/workflows/assemble-main.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Assemble main.dart and clean temporary parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib
          cat .github/transfer-parts/part-*.txt > lib/main.dart
          rm -rf .github/transfer-parts
          rm -f .github/workflows/assemble-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar navegación de inicio y Defensa de la Sana Doctrina"
          git push
